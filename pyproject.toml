[project]
name = "aurumai"
version = "0.0.1"
description = "Market Intelligence Operating System for gold and macro markets"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "networkx",
    "statsmodels",
    "statsforecast",
    "feedparser",
    "fredapi",
    "python-dotenv",
    "requests",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
technical = [
    "pandas-ta-classic>=0.6.52",
]
# Sprint 058: the news NLP stack is explicitly optional.  Its absence must
# never silently empty the news pipeline -- see src/news/intelligence.py.
nlp = [
    "transformers",
    "torch",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
