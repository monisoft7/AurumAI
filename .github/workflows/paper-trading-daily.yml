name: AurumAI Daily Paper Trading

on:
  schedule:
    - cron: "17 7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: Paper automation mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live-paper

permissions:
  contents: read
  actions: read

concurrency:
  group: aurumai-paper-trading-daily
  cancel-in-progress: false

jobs:
  paper-trading:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUTOMATION_MODE: ${{ github.event_name == 'schedule' && 'live-paper' || inputs.mode || 'dry-run' }}
      PAPER_LEDGER_REPOSITORY: ${{ vars.PAPER_LEDGER_REPOSITORY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAPER_LEDGER_TOKEN: ${{ secrets.PAPER_LEDGER_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout current paper harness
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/pyproject.toml

      - name: Read locked paper baseline
        id: paper-baseline
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(
              Path("harness/config/paper_trading_baseline.json").read_text(
                  encoding="utf-8"
              )
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"cohort_id={config['cohort_id']}\n")
              output.write(f"baseline_commit={config['baseline_commit']}\n")
          PY

      - name: Checkout frozen strategy baseline
        if: ${{ false }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.paper-baseline.outputs.baseline_commit }}
          path: strategy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout private paper ledger
        if: ${{ false }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PAPER_LEDGER_REPOSITORY }}
          token: ${{ secrets.PAPER_LEDGER_TOKEN }}
          path: ledger
          fetch-depth: 0

      - name: Install strategy dependencies
        if: env.AUTOMATION_MODE == 'live-paper'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./harness[technical]"

      - name: Install dependencies (dry-run fallback)
        if: env.AUTOMATION_MODE != 'live-paper'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./harness[technical]"

      - name: Run daily gold summary and send concise Arabic Telegram card
        working-directory: harness
        run: |
          mkdir -p ../automation-artifacts
          python scripts/run_daily.py
          cp -r outputs ../automation-artifacts/ || true

      - name: Upload sanitized paper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-${{ github.run_id }}
          path: automation-artifacts/
          if-no-files-found: warn
          retention-days: 90