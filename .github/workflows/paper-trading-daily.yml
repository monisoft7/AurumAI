name: AurumAI Daily Paper Trading

on:
  schedule:
    - cron: "17 7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: Paper automation mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live-paper

permissions:
  contents: read
  actions: read

concurrency:
  group: aurumai-paper-trading-daily
  cancel-in-progress: false

jobs:
  paper-trading:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOMATION_MODE: ${{ github.event_name == 'schedule' && 'live-paper' || inputs.mode || 'dry-run' }}
      PAPER_LEDGER_REPOSITORY: ${{ vars.PAPER_LEDGER_REPOSITORY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PAPER_LEDGER_TOKEN: ${{ secrets.PAPER_LEDGER_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout current paper harness
        uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/pyproject.toml

      - name: Read locked paper baseline
        id: paper-baseline
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(
              Path("harness/config/paper_trading_baseline.json").read_text(
                  encoding="utf-8"
              )
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"cohort_id={config['cohort_id']}\n")
              output.write(f"baseline_commit={config['baseline_commit']}\n")
          PY

      - name: Checkout frozen strategy baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.paper-baseline.outputs.baseline_commit }}
          path: strategy
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout private paper ledger
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PAPER_LEDGER_REPOSITORY }}
          token: ${{ secrets.PAPER_LEDGER_TOKEN }}
          path: ledger
          fetch-depth: 0

      - name: Install strategy dependencies
        if: env.AUTOMATION_MODE == 'live-paper'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./harness[technical]"

      - name: Read GitHub run creation time
        id: run-metadata
        if: ${{ env.AUTOMATION_MODE == 'live-paper' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          created_at="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .created_at)"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"

      - name: Run deterministic paper automation
        id: paper
        env:
          RUN_CREATED_AT_UTC: ${{ steps.run-metadata.outputs.created_at }}
          GITHUB_ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p automation-artifacts
          python harness/scripts/paper_trading_automation.py execute \
            --mode "$AUTOMATION_MODE" \
            --strategy-dir strategy \
            --harness-dir harness \
            --ledger-dir ledger \
            --output-dir automation-artifacts \
            --market-date "$(date -u +%F)" \
            --ledger-repository "$PAPER_LEDGER_REPOSITORY" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-created-at-utc "$RUN_CREATED_AT_UTC" \
            --run-url "$GITHUB_ACTIONS_RUN_URL"

      - name: Send Arabic Telegram summary
        if: ${{ always() && env.AUTOMATION_MODE == 'live-paper' }}
        continue-on-error: true
        run: |
          python harness/scripts/paper_trading_automation.py send-telegram \
            --mode "$AUTOMATION_MODE" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --message-file automation-artifacts/telegram_message.txt

      - name: Upload sanitized paper artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-${{ github.run_id }}
          path: automation-artifacts/
          if-no-files-found: warn
          retention-days: 90
