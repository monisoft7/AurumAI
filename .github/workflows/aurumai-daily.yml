name: AurumAI Daily Operations

# Scheduled cloud execution of the existing local daily path:
#   python scripts/run_daily.py
# The workflow is additive: it changes no decision, confidence, risk,
# news, technical, outcome or calibration semantics.

on:
  schedule:
    # 22:00 UTC, Monday-Friday.
    # - After the US gold session close (~17:00 ET = 21:00-22:00 UTC) so the
    #   daily gold bar for the trading date is final before measurement.
    # - Before 24:00 UTC so date.today() on the UTC runner matches the
    #   trading date the run measures (run_daily.py names run dirs by
    #   the runner-local date).
    # - Weekdays only: gold market data does not advance on weekends.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

# Only ONE daily production run may execute at a time: queued, never
# cancelled (a cancelled run could still have written registry state).
concurrency:
  group: aurumai-daily-operations
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Artifact retention for uploaded run outputs (days). Configurable.
  ARTIFACT_RETENTION_DAYS: "30"

jobs:
  daily:
    name: daily operations (run_daily)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (core + technical extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[technical]"

      # Mutable operational state that must survive ephemeral runners:
      # - runtime/run_registry.jsonl   (per-run registry history)
      # - runtime/calibration.json     (OOS ECE state; recomputed but cached)
      # - outputs/**/outcome.json      (pending decisions awaiting horizon)
      # - outputs/**/outcome.evaluated.json (scored history feeding calibration)
      # outcome.evaluated.json records are immutable and deduplicated by
      # decision_id; calibration is fully recomputed from them, so a rolling
      # cache is lossless for the contracts in outcome_calibration.py.
      # No generated runtime/output/data changes are committed back to Git.
      - name: Restore mutable operational state
        uses: actions/cache@v4
        with:
          path: |
            runtime/run_registry.jsonl
            runtime/calibration.json
            outputs/**/outcome.json
            outputs/**/outcome.evaluated.json
          key: aurumai-state-v1-${{ github.run_id }}
          restore-keys: |
            aurumai-state-v1-

      - name: Run daily operations
        env:
          # FRED_API_KEY is soft-required: absent it warns and falls back to
          # the committed CSV caches. TELEGRAM_* is optional by contract;
          # when unset the Telegram steps report "not configured" and the
          # run still succeeds. NEWS_API_KEY is not consumed by the runtime.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_daily.py

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurumai-outputs-${{ github.run_id }}
          path: outputs/
          retention-days: ${{ fromJSON(env.ARTIFACT_RETENTION_DAYS) }}
          if-no-files-found: warn
